name: CI - Tests Events Pattern

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installation de Java 17 (requis par PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Installation des dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérification des imports
        run: |
          python -c "import pyspark; print('PySpark OK :', pyspark.__version__)"
          python -c "import torch; print('PyTorch OK :', torch.__version__)"
          python -c "import sklearn; print('sklearn OK :', sklearn.__version__)"
          python -c "import pandas; print('pandas OK :', pandas.__version__)"
          python -c "import pyarrow; print('pyarrow OK :', pyarrow.__version__)"

      - name: Tests unitaires autonomes (sans données ni modèle)
        run: |
          pytest src/07_tests.py::TestPrediction::test_niveaux_risque -v --tb=short

      - name: Lint (vérification du style)
        run: |
          pip install flake8
          flake8 src/ --max-line-length=120 --ignore=E501,W503 --exclude=src/07_tests.py || true

      - name: Résumé
        if: always()
        run: |
          echo "========================================"
          echo "CI terminée — pipeline Events Pattern"
          echo "========================================"